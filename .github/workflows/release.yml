name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full CI checks
        run: |
          npx playwright install chromium --with-deps
          npm test
          npm run build
          npx playwright test tests/functional.spec.js tests/a11y.spec.js tests/sub-path.spec.js
      - name: Tag must match package.json and showcase.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "tag $TAG != package.json $PKG"; exit 1; fi
          node scripts/validate-showcase.mjs "$TAG"
      - name: Size check
        run: |
          BIG=$(find dist -type f -size +20M)
          if [ -n "$BIG" ]; then echo "Files over 20 MB:"; echo "$BIG"; exit 1; fi
          du -sh dist
      - name: Pack release archive and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SLUG="${{ github.event.repository.name }}"
          tar -czf "${SLUG}-${VERSION}.tar.gz" -C dist .
          sha256sum "${SLUG}-${VERSION}.tar.gz" > "${SLUG}-${VERSION}.tar.gz.sha256"
          cat "${SLUG}-${VERSION}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SLUG="${{ github.event.repository.name }}"
          gh release create "$GITHUB_REF_NAME" \
            "${SLUG}-${VERSION}.tar.gz" \
            "${SLUG}-${VERSION}.tar.gz.sha256" \
            --title "$SLUG $VERSION" \
            --notes "Release build $VERSION for the immersive learning showcase. See README.md for scope and evaluation status." \
            --verify-tag
